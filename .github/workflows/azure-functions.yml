name: Deploy TradingAgentsAPI to Azure Functions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Azure Function App Name (leave blank to use secret/default)'
        required: false
        default: ''

env:
  AZURE_FUNCTIONAPP_NAME: ${{ secrets.AZURE_FUNCTIONAPP_NAME || 'TradingAgentsAPI' }}
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Run Smoke Tests
        run: |
          python -m pip install pytest
          python -c "import tradingagents; import tradingagents_api; print('TradingAgents & TradingAgentsAPI import successfully!')"

      - name: Deploy to Azure Functions
        if: env.AZURE_FUNCTIONAPP_PACKAGE_SECRET != '' || env.AZURE_FUNCTIONAPP_PUBLISH_PROFILE != ''
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ github.event.inputs.app_name || env.AZURE_FUNCTIONAPP_NAME }}
          package: '.'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
